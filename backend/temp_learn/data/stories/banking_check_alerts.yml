version: "3.1"

stories:
  - story: check billing alerts (happy path)
    steps:
      - intent: check_alerts
      - action: action_check_billing_alerts
      - action: utter_list_alerts

  - story: user asks about bills and there are none
    steps:
      - intent: check_alerts
      - action: action_check_billing_alerts
      - action: utter_no_alerts

  - story: check alerts then ask to pay a specific bill
    steps:
      - intent: check_alerts
      - action: action_check_billing_alerts
      - action: utter_list_alerts
      - intent: pay_bill
        entities:
          - bill_type: electricity
          - amount: 2500
      - action: action_confirm_action
      - intent: affirm
      - action: action_transfer_money
      - action: action_generate_otp
      - action: utter_ask_for_otp
      - intent: provide_otp
      - action: action_verify_otp
      - action: utter_otp_verified
      - action: utter_transfer_success
