version: "3.1"

stories:
  - story: transfer with confirmation and OTP (happy path)
    steps:
      - intent: transfer_money
        # example: "Transfer 5000 to Raj"
      - action: action_confirm_action
      - intent: affirm
      - action: action_transfer_money
      - action: action_generate_otp
      - action: utter_ask_for_otp
      - intent: provide_otp
      - action: action_verify_otp
      - action: utter_otp_verified
      - action: utter_transfer_success

  - story: transfer cancelled by user
    steps:
      - intent: transfer_money
      - action: action_confirm_action
      - intent: deny
      - action: utter_transfer_failed

  - story: transfer missing recipient (slot filling)
    steps:
      - intent: transfer_money
        entities:
          - amount: 2000
      - action: action_confirm_action
      - intent: provide_recipient
        entities:
          - recipient: "Raj"
      - action: action_confirm_action
      - intent: affirm
      - action: action_transfer_money
      - action: action_generate_otp
      - action: utter_ask_for_otp
      - intent: provide_otp
      - action: action_verify_otp
      - action: utter_otp_verified
      - action: utter_transfer_success

  - story: transfer fails due to insufficient balance
    steps:
      - intent: transfer_money
        entities:
          - amount: 1000000
          - recipient: "HighValuePayee"
      - action: action_confirm_action
      - intent: affirm
      - action: action_transfer_money
      - action: utter_transfer_failed
      - intent: deny
      - action: utter_transfer_failed

  - story: transfer with wrong OTP then retry
    steps:
      - intent: transfer_money
        entities:
          - amount: 500
          - recipient: "Raj"
      - action: action_confirm_action
      - intent: affirm
      - action: action_transfer_money
      - action: action_generate_otp
      - action: utter_ask_for_otp
      - intent: provide_otp
        entities:
          - otp: "000000"
      - action: action_verify_otp
      - action: utter_otp_invalid
      - intent: affirm
      - action: action_generate_otp
      - action: utter_ask_for_otp
      - intent: provide_otp
      - action: action_verify_otp
      - action: utter_otp_verified
      - action: utter_transfer_success
