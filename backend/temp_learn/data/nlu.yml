# ==================== ENTITIES ====================
# Entities are automatically extracted from annotated examples above
# Common entities in this NLU:
# - amount: Transaction amounts (e.g., 500, 1000, 5000)
# - recipient: Person or account name (e.g., Raj, Priya, Amit)
# - account_number: Bank account numbers (e.g., 1234567890)
# - bill_type: Type of bill (e.g., electricity, phone, water)
# - otp: One-time password codes (e.g., 123456)

# ==================== SYNONYMS ====================
# Add synonyms for common variations
- synonym: "500"
  examples: |
    - five hundred
    - panch sau
    - पांच सौ

- synonym: "1000"
  examples: |
    - one thousand
    - ek hazaar
    - एक हज़ार

- synonym: "5000"
  examples: |
    - five thousand
    - panch hazaar
    - पांच हज़ार

- synonym: "10000"
  examples: |
    - ten thousand
    - das hazaar
    - दस हज़ार
    - ten k

- synonym: "100000"
  examples: |
    - one lakh
    - ek lakh
    - एक लाख
    - 1 lakh

# ==================== LOOKUP TABLES ====================
# Define lookup tables for common entities
- lookup: recipient
  examples: |
    - Raj
    - Priya
    - Amit
    - Suresh
    - Neha
    - Ramesh
    - Anjali
